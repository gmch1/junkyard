name: Aliyun LLM Proxy

on:
  pull_request:
    paths:
      - "aliyun-llm-proxy/**"
      - ".github/workflows/aliyun-llm-proxy.yml"
  push:
    branches:
      - main
    paths:
      - "aliyun-llm-proxy/**"
      - ".github/workflows/aliyun-llm-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build dashboard and test Go proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aliyun-llm-proxy

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache-dependency-path: aliyun-llm-proxy/go.sum

      - name: Install dashboard dependencies
        run: pnpm --dir dashboard install --frozen-lockfile

      - name: Lint and build dashboard
        run: |
          pnpm --dir dashboard run lint
          pnpm --dir dashboard run build
          git diff --exit-code -- dashboard/dist

      - name: Test proxy
        run: |
          go mod verify
          go vet ./...
          go test -race ./...

  macos-app:
    name: Build universal macOS app
    runs-on: macos-15
    defaults:
      run:
        working-directory: aliyun-llm-proxy

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache-dependency-path: aliyun-llm-proxy/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
          run_install: false

      - name: Build dashboard for embedding
        run: |
          pnpm --dir dashboard install --frozen-lockfile
          pnpm --dir dashboard run build

      - name: Install stable macOS signing identity
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${SIGNING_P12_BASE64}" || -z "${SIGNING_P12_PASSWORD}" ]]; then
            echo "Stable macOS signing secrets are not configured" >&2
            exit 1
          fi

          certificate_file="${RUNNER_TEMP}/AliyunLLMProxy-Release.p12"
          keychain_path="${RUNNER_TEMP}/aliyun-proxy-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "${SIGNING_P12_BASE64}" | openssl base64 -d -A -out "${certificate_file}"
          chmod 600 "${certificate_file}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security import "${certificate_file}" \
            -k "${keychain_path}" \
            -P "${SIGNING_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"

          signing_identity="$(openssl x509 -in macos-app/signing/AliyunLLMProxy-Release.pem -outform DER | shasum | awk '{ print $1 }')"
          imported_certificate="$(security find-certificate -c 'Aliyun LLM Proxy Local Release' -Z "${keychain_path}" | awk '/SHA-1 hash:/ { print tolower($3); exit }')"
          if [[ ! "${signing_identity}" =~ ^[0-9a-f]{40}$ || "${imported_certificate}" != "${signing_identity}" ]]; then
            echo "Imported macOS signing identity does not match the pinned certificate" >&2
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=${signing_identity}" >> "${GITHUB_ENV}"
          echo "MACOS_KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Test macOS backend
        run: go test -race ./...

      - name: Build universal app
        run: |
          chmod +x macos-app/build.sh
          ./macos-app/build.sh

      - name: Validate app and bundled service
        run: |
          app="macos-app/build/AliyunLLMProxy.app"
          backend="$app/Contents/MacOS/AliyunLLMProxyBackend"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/AliyunLLMProxy" -verify_arch x86_64 arm64
          lipo "$backend" -verify_arch x86_64 arm64

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            signature_details="$(codesign -dvvv "$app" 2>&1)"
            if grep -Fq 'Signature=adhoc' <<< "${signature_details}"; then
              echo "macOS app unexpectedly used an ad-hoc signature" >&2
              exit 1
            fi
            grep -Fq 'Authority=Aliyun LLM Proxy Local Release' <<< "${signature_details}"

            certificate_prefix="${RUNNER_TEMP}/AliyunLLMProxy-signing-cert-"
            codesign -d --extract-certificates="${certificate_prefix}" "$app"
            expected_certificate_sha256="$(openssl x509 -in macos-app/signing/AliyunLLMProxy-Release.pem -outform DER | shasum -a 256 | awk '{ print $1 }')"
            actual_certificate_sha256="$(shasum -a 256 "${certificate_prefix}0" | awk '{ print $1 }')"
            test "${actual_certificate_sha256}" = "${expected_certificate_sha256}"

            signing_certificate_sha1="$(openssl x509 -in macos-app/signing/AliyunLLMProxy-Release.pem -outform DER | shasum | awk '{ print $1 }')"
            designated_requirement="$(codesign -d -r- "$app" 2>&1)"
            grep -Fq 'identifier "io.github.gmch1.AliyunLLMProxy"' <<< "${designated_requirement}"
            grep -Fiq "certificate leaf = H\"${signing_certificate_sha1}\"" <<< "${designated_requirement}"
            if grep -Fq 'cdhash' <<< "${designated_requirement}"; then
              echo "macOS app has an unstable code-hash designated requirement" >&2
              exit 1
            fi

            backend_signature_details="$(codesign -dvvv "$backend" 2>&1)"
            grep -Fq 'Authority=Aliyun LLM Proxy Local Release' <<< "${backend_signature_details}"
            backend_requirement="$(codesign -d -r- "$backend" 2>&1)"
            grep -Fq 'identifier "io.github.gmch1.AliyunLLMProxy.backend"' <<< "${backend_requirement}"
            grep -Fiq "certificate leaf = H\"${signing_certificate_sha1}\"" <<< "${backend_requirement}"
            if grep -Fq 'cdhash' <<< "${backend_requirement}"; then
              echo "macOS backend has an unstable code-hash designated requirement" >&2
              exit 1
            fi
          fi

          state_dir="$(mktemp -d /tmp/aliyun-macos-ci.XXXXXX)"
          export ALIYUN_PROXY_STATE_DIR="$state_dir"
          export ALIYUN_PROXY_HOST="127.0.0.1"
          export ALIYUN_PROXY_PORT="39291"
          client_key="$("$backend" key)"
          "$backend" start
          trap '"$backend" stop >/dev/null 2>&1 || true' EXIT
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:39291/health)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:39291/)" = "200"
          curl -sS http://127.0.0.1:39291/admin/status | grep -q '"configured":false'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'X-Aliyun-Proxy-Admin: 1' --data '{"api_key":"sk-ci-dummy-upstream-key"}' http://127.0.0.1:39291/admin/upstream-key)" = "200"
          curl -sS http://127.0.0.1:39291/admin/status | grep -q '"configured":true'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $client_key" http://127.0.0.1:39291/v1/models)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong-key' http://127.0.0.1:39291/v1/models)" = "401"
          "$backend" stop
          trap - EXIT

      - name: Remove temporary signing keychain
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        run: security delete-keychain "${MACOS_KEYCHAIN_PATH}" || true

      - name: Upload macOS app
        uses: actions/upload-artifact@v6
        with:
          name: AliyunLLMProxy-macOS-universal
          path: aliyun-llm-proxy/macos-app/build/AliyunLLMProxy-macOS-universal.zip
          if-no-files-found: error
